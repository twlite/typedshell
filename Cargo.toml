[package]
name = "tsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A typed TypeScript subset compiled to standalone Bash"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
oxc_allocator = "0.153"
oxc_ast = "0.153"
oxc_parser = "0.153"
oxc_span = "0.153"
oxc_syntax = "0.153"
oxc_semantic = "0.153"
oxc_diagnostics = "0.153"
tempfile = "3"
