name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.97.0", stable]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt

      - name: Add Git Bash to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $gitUsrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $gitBin
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsrBin

      - name: Check Bash and PowerShell
        shell: bash
        run: |
          bash --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit, integration, and example targets
        run: cargo test --all-targets --locked

      - name: Verify generated installer scripts
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        shell: bash
        run: |
          bash scripts/generate-installers.sh
          git diff --exit-code -- scripts/install.sh scripts/install.ps1
          bash -n scripts/install.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/install.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
